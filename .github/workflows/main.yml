name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend lint
        run: pnpm lint

      - name: Run backend tests
        run: pnpm test

      - name: Build backend packages
        run: pnpm build

  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install mobile dependencies
        run: npm ci --prefix apps/streamforge-mobile

      - name: Run mobile lint
        run: npm --prefix apps/streamforge-mobile run lint

      - name: Run mobile typecheck
        run: npm --prefix apps/streamforge-mobile run type-check

      - name: Run mobile tests
        run: npm --prefix apps/streamforge-mobile run test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - mobile-ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/streamforge-infra
            git pull
            docker compose -f docker/docker-compose.base.yml -f docker/docker-compose.prod.yml up -d --build
